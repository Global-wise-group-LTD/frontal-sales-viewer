<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>מחלקת פגישות פרונטליות · דוח ביצועים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2b2418;--mut:#7a6e5d;--line:#e6dccb;--acc:#8B6B3E;--acc2:#C9A66B;--good:#3f7a52;--mid:#b3832b;--bad:#b0442f}
*{box-sizing:border-box}body{margin:0;font-family:Heebo,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
header{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:16px}
header h1{margin:0;font-size:22px;font-weight:800}header p{margin:4px 0 0;color:var(--mut)}
body.embed header{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer;padding:4px 10px;border:1px solid var(--line);border-radius:20px}
.bar input[type=date]{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:8px}
.upd{color:var(--mut);font-size:12px;margin-inline-start:auto}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:17px}.cap{color:var(--mut);font-size:12px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:right}thead th{background:#efe6d6;font-weight:700}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;color:#fff}.success{background:var(--good)}.warning{background:var(--mid)}.danger{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.chart{display:flex;align-items:flex-end;gap:3px;height:160px;border-bottom:1px solid var(--line);padding-top:10px}
.col{flex:1;min-width:6px;display:flex;flex-direction:column-reverse}.col .a{background:var(--acc)}.col .n{background:var(--acc2)}
.xl{display:flex;gap:3px;font-size:10px;color:var(--mut)}.xl div{flex:1;min-width:6px;text-align:center}
button{font:inherit;border:1px solid var(--line);background:#fff;padding:4px 10px;border-radius:8px;cursor:pointer}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.leg{font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px}
.wrapx{overflow-x:auto}
#gate{max-width:380px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}
#gate input{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin:10px 0}
#gate .err{color:var(--bad);font-size:13px;min-height:18px}
</style></head><body><div class="wrap">
<header><h1>מחלקת פגישות פרונטליות · דוח ביצועים</h1><p>לידים שהשאירו פרטים לפגישת ייעוץ פרונטלית · Wise Academy</p></header>
<div id="gate"><h3 style="margin:0">הזן קוד גישה</h3><input id="code" type="password" autocomplete="current-password"><button class="on" id="go">כניסה</button><div class="err" id="gerr"></div></div>
<div id="main" style="display:none"><div class="bar">
<button data-p="today">היום</button><button data-p="yest">אתמול</button><button data-p="7d">7 ימים אחרונים</button><button data-p="month">החודש</button><button data-p="lmonth">חודש קודם</button>
<span>מ-</span><input type="date" id="from"><span>עד</span><input type="date" id="to">
<span id="toggles"></span><span class="upd" id="upd"></span></div><div id="app"></div></div></div>
<script>
const QS=new URLSearchParams(location.search),EMB=QS.get('embed')==='1',PO='https://fb-dashboard-one.vercel.app';
if(EMB)document.body.classList.add('embed');
const ST={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(code,E){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.salt),iterations:E.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct));return JSON.parse(new TextDecoder().decode(pt))}
function parentKey(){return new Promise(res=>{if(window.parent===window)return res(null);let done=false;const h=e=>{if(e.origin!==PO||e.source!==window.parent)return;const d=e.data;if(!d||d.type!=='wise-key'||typeof d.k!=='string'||!d.k.trim())return;done=true;window.removeEventListener('message',h);res(d.k.trim())};
window.addEventListener('message',h);try{window.parent.postMessage({type:'wise-key-request',page:'frontal'},PO)}catch(e){}setTimeout(()=>{if(!done){window.removeEventListener('message',h);res(null)}},8000)})}
let E=null,DATA=null;
async function tryCode(c,save){try{DATA=await decrypt(c,E);if(save)ST.set('fk',c);start();return true}catch(e){return false}}
async function boot(){E=await fetch('data.enc.json?'+Date.now()).then(r=>r.json());
const cands=[QS.get('k'),EMB?null:ST.get('fk')].filter(Boolean);for(const c of cands)if(await tryCode(c,!QS.get('k')))return;
if(EMB){const pk=await parentKey();if(pk&&await tryCode(pk,false))return}
ST.del('fk');document.getElementById('gate').style.display='block';const go=async()=>{const c=document.getElementById('code').value.trim();if(!c)return;document.getElementById('gerr').textContent='בודק…';if(!await tryCode(c,true))document.getElementById('gerr').textContent='קוד שגוי, נסה שוב.'};
document.getElementById('go').onclick=go;document.getElementById('code').onkeydown=e=>{if(e.key==='Enter')go()}}
const NAMES={dept:'כל המחלקה',eden:'עדן חן',tal:'טל קורן',idan:'עידן אליאס'};
const BK=['עד שעה','1–4 שעות','4–24 שעות','1–2 ימים','מעל יומיים','לא התקשרו'];
const TONE={'עד שעה':'success','1–4 שעות':'success','4–24 שעות':'warning','1–2 ימים':'danger','מעל יומיים':'danger','לא התקשרו':'danger'};const TL={success:'טוב',warning:'בינוני',danger:'איטי'};
const GN={s:'תיאמו לבד בבוט',d:'תואמו (מקדמה)',n:'לא תיאמו',a:'כל הלידים'};
const STS=['נרשם','פולואפ','אין מענה','לא רלוונטי','ליד לא תקין','חדש'];const IRR=['התחרט','תזמון לא טוב','נרשמתי לקורס אחר'];
const WIN=[['00–07',0,7],['07–11',7,11],['11–14',11,14],['14–18',14,18],['18–24',18,24]];
let sel={dept:1,eden:1,tal:1,idan:1},one='dept',grp='s',from,to;
const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function now(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Jerusalem'}))}
function preset(p){const n=now(),t=iso(n);let f=t,e=t;
 if(p==='yest'){const y=new Date(n);y.setDate(y.getDate()-1);f=e=iso(y)}
 if(p==='7d'){const y=new Date(n);y.setDate(y.getDate()-6);f=iso(y)}
 if(p==='month'){f=t.slice(0,8)+'01'}
 if(p==='lmonth'){const a=new Date(n.getFullYear(),n.getMonth()-1,1),b=new Date(n.getFullYear(),n.getMonth(),0);f=iso(a);e=iso(b)}
 from=f;to=e;document.getElementById('from').value=f;document.getElementById('to').value=e;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===p));render()}
const H=(a,b)=>(new Date(b)-new Date(a))/36e5;
const med=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const r1=x=>x==null?null:Math.round(x*10)/10,r2=x=>x==null?null:Math.round(x*100)/100;
function scope(k){
 const L=DATA.leads.map((l,i)=>({i,t:l[0],o:l[1],g:l[2],st:l[3],ir:l[4],mi:l[5],rg:l[6]})).filter(l=>l.t.slice(0,10)>=from&&l.t.slice(0,10)<=to);
 const ids=new Set(L.map(l=>l.i));const allC=DATA.calls.filter(c=>ids.has(c[0]));
 const leads=k==='dept'?L:L.filter(l=>l.o===k);const calls=k==='dept'?allC:allC.filter(c=>c[2]===k);
 const byLead={};allC.forEach(c=>(byLead[c[0]]=byLead[c[0]]||[]).push(c));
 const ans=calls.filter(c=>c[3]);const days={};calls.forEach(c=>{const d=c[1].slice(0,10);days[d]=days[d]||[0,0];days[d][c[3]?0:1]++});
 const wd=Object.keys(days).length;const talk=ans.reduce((s,c)=>s+c[4],0);
 const ttf={},att={},reach={};leads.forEach(l=>{const oc=byLead[l.i]||[];att[l.i]=oc.length;reach[l.i]=oc.some(c=>c[3]);ttf[l.i]=oc.length?H(l.t,oc.reduce((m,c)=>c[1]<m?c[1]:m,oc[0][1])):null});
 const bk=h=>h==null?'לא התקשרו':h<1?'עד שעה':h<4?'1–4 שעות':h<24?'4–24 שעות':h<48?'1–2 ימים':'מעל יומיים';
 const N=leads.length,hs=leads.map(l=>ttf[l.i]).filter(x=>x!=null);
 const nr=leads.filter(l=>!reach[l.i]&&att[l.i]>0);
 const reg=leads.filter(l=>l.st===0);
 const grpStats=g=>{const gl=g==='a'?leads:leads.filter(l=>l.g===g);const st={},ir={};gl.forEach(l=>{if(l.st>=0)st[STS[l.st]]=(st[STS[l.st]]||0)+1;if(l.ir>=0)ir[IRR[l.ir]]=(ir[IRR[l.ir]]||0)+1});const mi=gl.filter(l=>l.mi>=0);
  return{leads:gl.length,deposits:gl.filter(l=>l.g==='d').length,registered:gl.filter(l=>l.st===0).length,status:st,irr:ir,inv:mi.length,invAvg:mi.length?r2(mi.reduce((s,l)=>s+l.mi,0)/mi.length):null}};
 const hr=c=>+c[1].slice(11,13);
 return{N,calls:calls.length,ans:ans.length,ar:calls.length?r1(ans.length/calls.length*100):null,talk,avgAns:ans.length?r2(talk/ans.length):null,wd,
  perDay:wd?{c:r1(calls.length/wd),a:r1(ans.length/wd),t:r1(talk/wd)}:null,medTtf:r1(med(hs)),never:N?r1(leads.filter(l=>!att[l.i]).length/N*100):null,
  avgAtt:N?r2(leads.reduce((s,l)=>s+att[l.i],0)/N):null,
  bk:BK.map(b=>leads.filter(l=>bk(ttf[l.i])===b).length),
  win:WIN.map(([w,a,b])=>{const cw=calls.filter(c=>hr(c)>=a&&hr(c)<b);return{w,leads:leads.filter(l=>{const h=+l.t.slice(11,13);return h>=a&&h<b}).length,calls:cw.length,ar:cw.length?Math.round(cw.filter(c=>c[3]).length/cw.length*100):null}}),
  cov:[leads.filter(l=>reach[l.i]).length,nr.filter(l=>att[l.i]===1).length,nr.filter(l=>att[l.i]>=2&&att[l.i]<=3).length,nr.filter(l=>att[l.i]>=4).length,leads.filter(l=>!att[l.i]).length],
  attD:[[1,1],[2,2],[3,3],[4,5],[6,999]].map(([a,b])=>leads.filter(l=>att[l.i]>=a&&att[l.i]<=b).length),
  durD:[[0,1],[1,3],[3,5],[5,10],[10,1e9]].map(([a,b])=>ans.filter(c=>c[4]>=a&&c[4]<b).length),
  days:Object.keys(days).sort().map(d=>[d.slice(8)+'/'+d.slice(5,7),days[d][0],days[d][1]]),hours:Array.from({length:24},(_,h)=>calls.filter(c=>hr(c)===h).length),
  svo:BK.map(b=>{const g=leads.filter(l=>bk(ttf[l.i])===b);return[b,g.length,g.filter(l=>reach[l.i]).length,g.filter(l=>l.g==='d').length,g.filter(l=>l.st===0).length]}),
  close:{dep:leads.filter(l=>l.g==='d').length,reg:reg.length,rate:N?r1(reg.length/N*100):null,calls:reg.length?r1(reg.reduce((s,l)=>s+att[l.i],0)/reg.length):null,
   days:reg.filter(l=>l.rg).length?r1(reg.filter(l=>l.rg).reduce((s,l)=>s+H(l.t,l.rg+'T12:00')/24,0)/reg.filter(l=>l.rg).length):null},
  groups:{s:grpStats('s'),d:grpStats('d'),n:grpStats('n'),a:grpStats('a')}}}
const f=(v,s='')=>v==null?'–':v+s;const pc=(n,N)=>N?`${n} (${Math.round(n/N*100)}%)`:'–';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function tbl(cols,rows){return `<div class="wrapx"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${typeof c==='object'&&c?`<span class="tag ${c.t}">${c.x}</span>`:esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function bars(days){const mx=Math.max(1,...days.map(d=>d[1]+d[2])),st=Math.ceil(days.length/12);return `<div class="chart">${days.map(d=>`<div class="col" title="${d[0]}: ${d[1]} נענו, ${d[2]} לא נענו"><span class="a" style="height:${d[1]/mx*150}px"></span><span class="n" style="height:${d[2]/mx*150}px"></span></div>`).join('')}</div><div class="xl">${days.map((d,i)=>`<div>${i%st===0?d[0]:''}</div>`).join('')}</div>`}
function hbars(h){const v=h.slice(8,20),mx=Math.max(1,...v);return `<div class="chart">${v.map(x=>`<div class="col" title="${x}"><span class="a" style="height:${x/mx*150}px"></span></div>`).join('')}</div><div class="xl">${v.map((x,i)=>`<div>${i+8}</div>`).join('')}</div>`}
function render(){if(!DATA||!from)return;
 const SS={};Object.keys(NAMES).forEach(k=>SS[k]=scope(k));const has=k=>SS[k].N>0;
 const keys=Object.keys(NAMES).filter(k=>sel[k]),dk=keys.filter(has),cols=['מדד',...keys.map(k=>NAMES[k])];
 const row=(l,fn)=>[l,...keys.map(k=>has(k)?String(fn(SS[k])):'אין נתונים בטווח')];
 if(!has(one))one='dept';const s1=SS[one],D=SS.dept;let h='';
 if(!D.N){document.getElementById('app').innerHTML='<section><h2>אין לידים בטווח התאריכים שנבחר</h2></section>';return}
 const segOne=`<div>${['dept','eden','tal','idan'].filter(has).map(k=>`<button class="${k===one?'on':''}" onclick="one='${k}';render()">${NAMES[k]}</button>`).join(' ')}</div>`;
 const segG=`<div>${['s','d','n','a'].map(g=>`<button class="${g===grp?'on':''}" onclick="grp='${g}';render()">${GN[g]} (${D.groups[g].leads})</button>`).join(' ')}</div>`;
 h+=`<section><h2>סיכום הנציג</h2>${tbl(cols,[row('זמן חציוני עד שיחה ראשונה',s=>f(s.medTtf,' ש׳')),row('לידים שלא התקשרו אליהם',s=>f(s.never,'%')),row('שיחות שנענו (מכלל השיחות היוצאות)',s=>f(s.ar,'%')),row('משך ממוצע של שיחה שנענתה',s=>f(s.avgAns,' דק׳')),row('ממוצע ניסיונות חיוג לליד',s=>f(s.avgAtt))])}</section>`;
 h+=`<section><h2>היקף הפעילות</h2><p class="cap">שיחות יוצאות ללידים שנכנסו בטווח, לפי הנציג שביצע את השיחה. יום עבודה הוא יום שבו הנציג ביצע לפחות שיחה אחת.</p>${tbl(cols,[row('לידים בטיפול',s=>s.N),row('שיחות יוצאות (סה״כ)',s=>s.calls),row('שיחות שנענו (סה״כ)',s=>s.ans),row('זמן דיבור (סה״כ)',s=>r1(s.talk/60)+' ש׳'),row('ימי עבודה',s=>s.wd),row('שיחות יוצאות ליום עבודה',s=>f(s.perDay&&s.perDay.c)),row('שיחות שנענו ליום עבודה',s=>f(s.perDay&&s.perDay.a)),row('זמן דיבור ליום עבודה',s=>f(s.perDay&&s.perDay.t,' דק׳'))])}</section>`;
 h+=`<section><h2>מהירות תגובה</h2><p class="cap">הזמן מכניסת הליד עד השיחה היוצאת הראשונה אליו.</p>${tbl([...cols,'הערכה'],BK.map((b,i)=>[...row(b,s=>pc(s.bk[i],s.N)),{t:TONE[b],x:TL[TONE[b]]}]))}<br>${tbl(['כניסת ליד',...dk.flatMap(k=>[NAMES[k]+' · לידים','שיחות','% מענה'])],WIN.map((w,i)=>[w[0],...dk.flatMap(k=>{const x=SS[k].win[i];return[x.leads,x.calls,f(x.ar,'%')]})]))}</section>`;
 h+=`<section><h2>כיסוי והתמדה</h2>${tbl(cols,[row('השגנו (נענו לפחות פעם אחת)',s=>pc(s.cov[0],s.N)),row('לא הושגו אחרי ניסיון אחד',s=>pc(s.cov[1],s.N)),row('לא הושגו אחרי 2–3 ניסיונות',s=>pc(s.cov[2],s.N)),row('לא הושגו אחרי 4 ניסיונות או יותר',s=>pc(s.cov[3],s.N)),row('לא התקשרו אליהם בכלל',s=>pc(s.cov[4],s.N))])}<br><div class="grid">${tbl(['ניסיונות לליד',...dk.map(k=>NAMES[k])],['1','2','3','4–5','6+'].map((b,i)=>[b,...dk.map(k=>SS[k].attD[i])]))}${tbl(['משך שיחה שנענתה',...dk.map(k=>NAMES[k])],['עד דקה','1–3 דק׳','3–5 דק׳','5–10 דק׳','10+ דק׳'].map((b,i)=>[b,...dk.map(k=>pc(SS[k].durD[i],SS[k].ans))]))}</div></section>`;
 h+=`<section><h2>פעילות לפי יום ושעה</h2>${segOne}<p class="leg"><i style="background:var(--acc)"></i>נענו <i style="background:var(--acc2)"></i>לא נענו</p>${bars(s1.days)}<p class="cap" style="margin-top:14px">שיחות לפי שעה ביום (08–19)</p>${hbars(s1.hours)}</section>`;
 h+=`<section><h2>שיחות ותוצאות</h2><p class="cap">מהירות התגובה מול התוצאה (${NAMES[one]}), ומדדי סגירה לכל נציג.</p>${tbl(['זמן עד שיחה ראשונה','לידים','השגנו','תואם (מקדמה)','נרשמו'],s1.svo.map(x=>[x[0],x[1],pc(x[2],x[1]),x[3],x[4]]))}<br>${tbl(cols,[row('מקדמות (תואם)',s=>s.close.dep),row('נרשמו',s=>s.close.reg),row('אחוז סגירה',s=>f(s.close.rate,'%')),row('ממוצע שיחות עד סגירה',s=>f(s.close.calls)),row('ממוצע ימים מליד לעסקה',s=>f(s.close.days))])}</section>`;
 h+=`<section><h2>השוואה לפי סוג תיאום</h2><p class="cap">'תיאם בלי מקדמה' פירושו שהליד קבע לעצמו מועד ביומן דרך הבוט ועוד לא תואם באמת. 'תואם' פירושו ששולמה מקדמה.</p>${segG}<br>${tbl(cols,[row('לידים',s=>s.groups[grp].leads),row('מקדמות (תואם)',s=>s.groups[grp].deposits),row('נרשמו',s=>s.groups[grp].registered),...STS.map(st=>row('סטטוס: '+st,s=>pc(s.groups[grp].status[st]||0,s.groups[grp].leads))),...IRR.map(r=>row('חוסר רלוונטיות: '+r,s=>s.groups[grp].irr[r]||0)),row('סומנו לא תקין (לא אוטומטי)',s=>s.groups[grp].inv),row('ממוצע שיחות עד לא תקין (לא אוטומטי)',s=>f(s.groups[grp].invAvg))])}</section>`;
